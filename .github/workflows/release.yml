# Publishes a release when a tag v* is pushed: tests on each OS (ci.yml), builds each
# platform, and creates the GitHub release with the binaries, SHA256SUMS, install.sh and
# install.ps1 in one step. Run it by hand (workflow_dispatch) for a dry run that builds
# and prints the sums but publishes nothing. A tag with a "-" (v0.1.0-rc.1) becomes a
# prerelease, which moves neither releases/latest nor "go install ...@latest".
#
# Asset names never change: the install scripts and "gander self update" build them.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; new repositories' tokens are read-only
    steps:
      # Pinned by commit, since tags can be moved (GHSA-mrrh-fwg8-r2c3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true # Go's newest patch release, not whatever the runner has
          cache: false

      - name: Build
        env:
          # Without it, linux/amd64 is a native build here and needs the runner's glibc.
          CGO_ENABLED: '0'
        run: |
          # Outside the checkout: Go stamps every build after an untracked file +dirty.
          dist="$RUNNER_TEMP/dist"
          mkdir "$dist"
          for t in darwin/arm64:macos-arm64 darwin/amd64:macos-x64 linux/amd64:linux-x64 windows/amd64:windows-x64; do
            goos=${t%%/*} rest=${t#*/}
            ext=
            [ "$goos" = windows ] && ext=.exe
            # No -s -w: stripped Go binaries get flagged by Microsoft Defender more often.
            GOOS=$goos GOARCH=${rest%%:*} go build -trimpath -o "$dist/gander-${rest#*:}$ext" .
          done
          cp install.sh install.ps1 "$dist/"
          cd "$dist"
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          go version -m gander-*

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/dist"
          # The version comes from the pushed tag, as Go stamps it; anything else, such
          # as +dirty, stops the release.
          go version -m gander-* | awk -v t="$TAG" '$1 == "mod" && $3 != t { print "stamped " $3 ", not " t; bad = 1 } END { exit bad }'
          pre=
          case $TAG in *-*) pre=--prerelease ;; esac
          # Given files, gh keeps the release a draft until every upload finishes, so
          # releases/latest never points at a release without its binaries.
          gh release create "$TAG" $pre --verify-tag --generate-notes ./*
